// Composant Toast
const Toast = ({ message, type, onClose }) => {
    useEffect(() => {
        const timer = setTimeout(onClose, 3000);
        return () => clearTimeout(timer);
    }, [onClose]);

    return (
        <div className={`fixed bottom-4 right-4 z-50 flex items-center gap-3 px-6 py-4 rounded-lg shadow-lg transition-all duration-300 transform translate-y-0 ${
            type === 'success' ? 'bg-green-600' : 'bg-red-600'
        } text-white`}>
            {type === 'success' ? <CheckCircle className="w-5 h-5" /> : <AlertCircle className="w-5 h-5" />}
            <span>{message}</span>
        </div>
    );
};

// Composant Modal Panier
const CartModal = ({ isOpen, onClose, cartItems, onRemoveFromCart, onUpdateQuantity }) => {
    if (!isOpen) return null;

    const total = cartItems.reduce((sum, item) => sum + (parseFloat(item.prix.replace(',', '')) * item.quantity), 0);

    return (
        <>
            <div className="fixed inset-0 bg-black/50 z-50" onClick={onClose}></div>
            <div className="fixed right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl z-50 transform transition-transform duration-300 overflow-y-auto">
                <div className="p-6">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl elegant-text font-semibold">Mon Panier</h2>
                        <button onClick={onClose} className="p-2 hover:text-gold transition-colors">
                            <X className="w-6 h-6" />
                        </button>
                    </div>

                    {cartItems.length === 0 ? (
                        <div className="text-center py-12">
                            <ShoppingCart className="w-16 h-16 mx-auto text-gray-300 mb-4" />
                            <p className="text-gray-500">Votre panier est vide</p>
                        </div>
                    ) : (
                        <>
                            <div className="space-y-4 mb-6">
                                {cartItems.map((item) => (
                                    <div key={item.id} className="flex gap-4 pb-4 border-b border-gray-100">
                                        <img src={item.image} alt={item.nom} className="w-20 h-20 object-cover rounded" />

                                            <h3 className="font-semibold">{item.nom}</h3>
                                            <p className="text-gold font-semibold">{item.prix}€</p>

                                                    onClick={() => onUpdateQuantity(item.id, item.quantity - 1)}

                                                <span>{item.quantity}</span>
                                                <button 
                                                    onClick={() => onUpdateQuantity(item.id, item.quantity + 1)}

                                                    onClick={() => onRemoveFromCart(item.id)}

                                </div>
                                <button className="w-full py-4 btn-primary rounded-none font-light tracking-wider text-sm">
                                    VALIDER LA COMMANDE
                                </button>
                            </div>
                        </>
                    )}

};

                                <div className="p-6">
                                    <div className="flex items-center justify-between mb-3">
                                        <h3 className="elegant-text text-lg font-semibold">{produit.nom}</h3>
                                        <div className="flex items-center gap-1">
                                            <Star className="w-4 h-4 fill-gold text-gold" />
                                            <span className="text-sm text-gray-600">{produit.note}</span>
                                        </div>
                                    </div>
                                    
                                    <p className="text-sm text-gray-500 mb-4">{produit.avis} avis</p>
                                    
                                    <div className="flex items-center justify-between pt-4 border-t border-gray-100">
                                        <span className="text-2xl elegant-text font-semibold">{produit.prix}€</span>
                                        <button className="p-2 hover:text-gold transition-colors">
                                            <Heart className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>

            {/* Catégories */}
            <section className="py-24 px-6 bg-white">
                <div className="max-w-7xl mx-auto">
                    <div className="text-center mb-16">
                        <p className="text-gold text-sm tracking-widest mb-4 fade-in-up">EXPLOREZ</p>
                        <h2 className="text-5xl section-title mb-6 fade-in-up" style={{ animationDelay: '0.1s' }}>
                            Nos Catégories
                        </h2>
                    </div>

                    <div className="flex flex-wrap justify-center gap-3 mb-16">
                        {categories.map((cat) => (
                            <button
                                key={cat.id}
                                onClick={() => setActiveCategory(cat.id)}
                                className={`px-6 py-3 text-sm tracking-wider transition-all duration-300 ${
                                    activeCategory === cat.id
                                        ? 'bg-gold text-white'
                                        : 'bg-white border border-gray-200 text-gray-700 hover:border-gold'
                                }`}
                            >
                                {cat.nom}
                            </button>
                        ))}
                    </div>

                    <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {produitsAffiches.map((produit, index) => (
                            <div
                                key={produit.id}
                                className="product-card bg-white elegant-border overflow-hidden group fade-in-up"
                                style={{ animationDelay: `${index * 0.05}s` }}
                            >
                                <div className="relative overflow-hidden">
                                    <img
                                        src={produit.image}
                                        alt={produit.nom}
                                        className="w-full h-80 object-cover"
                                    />
                                    {produit.badge && (
                                        <div className="absolute top-4 left-4 px-3 py-1 bg-white text-gold text-xs tracking-wider">
                                            {produit.badge}
                                        </div>
                                    )}
                                    <button 
                                        onClick={() => ajouterAuPanier(produit)}
                                        className="absolute bottom-4 left-4 right-4 px-6 py-3 bg-white text-black text-sm tracking-wider opacity-0 group-hover:opacity-100 transform translate-y-4 group-hover:translate-y-0 transition-all duration-300"
                                    >
                                        AJOUTER AU PANIER
                                    </button>
                                </div>

                                <div className="p-6">
                                    <div className="flex items-center justify-between mb-3">
                                        <h3 className="elegant-text text-lg font-semibold">{produit.nom}</h3>
                                        <div className="flex items-center gap-1">
                                            <Star className="w-4 h-4 fill-gold text-gold" />
                                            <span className="text-sm text-gray-600">{produit.note}</span>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center justify-between pt-4 border-t border-gray-100">
                                        <span className="text-2xl elegant-text font-semibold">{produit.prix}€</span>
                                        <button className="p-2 hover:text-gold transition-colors">
                                            <Heart className="w-5 h-5" />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>

            {/* À Propos */}
            <section id="a-propos" className="py-24 px-6 bg-gray-50">
                <div className="max-w-7xl mx-auto">
                    <div className="grid lg:grid-cols-2 gap-16 items-center">
                        <div className="fade-in-up">
                            <img
                                src="https://images.unsplash.com/photo-1497366216548-37526070297c?w=800&h=600&fit=crop"
                                alt="À propos"
                                className="w-full h-auto rounded-sm shadow-lg"
                            />
                        </div>

                        <div>
                            <p className="text-gold text-sm tracking-widest mb-4 fade-in-up">NOTRE HISTOIRE</p>
                            <h2 className="text-5xl section-title mb-6 fade-in-up" style={{ animationDelay: '0.1s' }}>
                                À Propos de NEXORA
                            </h2>
                            
                            <div className="space-y-6 text-gray-600 leading-relaxed fade-in-up" style={{ animationDelay: '0.2s' }}>
                                <p>
                                    Fondée en 2014, NEXORA s'est imposée comme une référence incontournable dans le domaine 
                                    de la technologie premium. Notre mission est simple : offrir à nos clients une sélection 
                                    rigoureuse des meilleurs produits du marché.
                                </p>
                                
                                <p>
                                    Chaque produit de notre catalogue est soigneusement choisi par notre équipe d'experts 
                                    passionnés, garantissant ainsi une qualité irréprochable et des performances exceptionnelles. 
                                    Nous croyons que la technologie doit être à la fois belle, fonctionnelle et durable.
                                </p>
                                
                                <p>
                                    Notre engagement envers l'excellence se reflète dans notre service client de premier ordre, 
                                    notre garantie étendue de 3 ans et notre politique de retour sans tracas. Chez NEXORA, 
                                    votre satisfaction est notre priorité absolue.
                                </p>
                            </div>

                            <div className="mt-10 fade-in-up" style={{ animationDelay: '0.3s' }}>
                                <button className="px-8 py-4 btn-primary rounded-none font-light tracking-wider text-sm">
                                    EN SAVOIR PLUS
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            {/* Témoignages */}
            <section className="py-24 px-6 bg-white">
                <div className="max-w-7xl mx-auto">
                    <div className="text-center mb-16">
                        <p className="text-gold text-sm tracking-widest mb-4 fade-in-up">TÉMOIGNAGES</p>
                        <h2 className="text-5xl section-title mb-6 fade-in-up" style={{ animationDelay: '0.1s' }}>
                            Ce Que Disent Nos Clients
                        </h2>
                    </div>

                    <div className="grid md:grid-cols-3 gap-8">
                        {temoignages.map((temoignage, index) => (
                            <div
                                key={temoignage.nom}
                                className="bg-gray-50 p-8 elegant-border hover-lift fade-in-up"
                                style={{ animationDelay: `${index * 0.1}s` }}
                            >
                                <div className="flex gap-1 mb-6">
                                    {[...Array(temoignage.note)].map((_, i) => (
                                        <Star key={i} className="w-5 h-5 fill-gold text-gold" />
                                    ))}
                                </div>
                                
                                <p className="text-gray-600 italic mb-6 leading-relaxed">
                                    "{temoignage.texte}"
                                </p>
                                
                                <div className="pt-6 border-t border-gray-200">
                                    <p className="elegant-text font-semibold text-lg mb-1">{temoignage.nom}</p>
                                    <p className="text-sm text-gray-500">{temoignage.role}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            </section>

            {/* Newsletter */}
            <section className="py-24 px-6 bg-gradient-to-br from-gray-900 to-black text-white">
                <div className="max-w-4xl mx-auto text-center">
                    <div className="inline-block mb-6 fade-in-up">
                        <Mail className="w-16 h-16 text-gold mx-auto" />
                    </div>
                    
                    <h2 className="text-5xl section-title text-white mb-6 fade-in-up" style={{ animationDelay: '0.1s' }}>
                        Rejoignez Notre Communauté
                    </h2>
                    
                    <p className="text-xl text-gray-300 mb-10 fade-in-up" style={{ animationDelay: '0.2s' }}>
                        Inscrivez-vous à notre newsletter pour recevoir en exclusivité nos dernières nouveautés, 
                        offres spéciales et conseils d'experts
                    </p>

                    <form onSubmit={handleNewsletterSubmit} className="flex flex-col sm:flex-row gap-4 max-w-2xl mx-auto fade-in-up" style={{ animationDelay: '0.3s' }}>
                        <input
                            type="email"
                            value={email}
                            onChange={(e) => setEmail(e.target.value)}
                            placeholder="Votre adresse email"
                            required
                            className="flex-1 px-6 py-4 bg-white/10 border border-white/20 text-white placeholder-gray-400 focus:outline-none focus:border-gold transition-colors"
                        />
                        <button type="submit" className="px-8 py-4 bg-gold text-black font-light tracking-wider text-sm hover:bg-white transition-colors whitespace-nowrap">
                            S'INSCRIRE
                        </button>
                    </form>

                    <p className="text-sm text-gray-400 mt-6 fade-in-up" style={{ animationDelay: '0.4s' }}>
                        Nous respectons votre vie privée. Désabonnement possible à tout moment.
                    </p>
                </div>
            </section>

            {/* Footer */}
            <footer id="contact" className="bg-white py-16 px-6 border-t border-gray-100">
                <div className="max-w-7xl mx-auto">
                    <div className="grid md:grid-cols-4 gap-12 mb-12">
                        <div className="md:col-span-2">
                            <h3 className="text-2xl elegant-text font-semibold mb-4">
                                <span className="text-gold">N</span>EXORA
                            </h3>
                            <p className="text-gray-600 mb-6 leading-relaxed">
                                Votre destination premium pour la technologie d'exception. 
                                Nous sélectionnons avec soin les meilleurs produits pour vous offrir 
                                une expérience d'achat incomparable.
                            </p>
                            <div className="flex gap-4">
                                {[
                                    { icon: Facebook, label: 'Facebook' },
                                    { icon: Instagram, label: 'Instagram' },
                                    { icon: Twitter, label: 'Twitter' }
                                ].map(({ icon: Icon, label }) => (
                                    <button
                                        key={label}
                                        className="w-10 h-10 border border-gray-200 hover:border-gold hover:text-gold transition-colors flex items-center justify-center"
                                        aria-label={label}
                                    >
                                        <Icon className="w-5 h-5" />
                                    </button>
                                ))}
                            </div>
                        </div>

                        <div>
                            <h4 className="text-lg elegant-text font-semibold mb-4">Navigation</h4>
                            <ul className="space-y-3">
                                {['Accueil', 'Boutique', 'À propos', 'Contact', 'FAQ', 'Blog'].map((link) => (
                                    <li key={link}>
                                        <button 
                                            onClick={() => scrollToSection(link === 'Accueil' ? 'accueil' : link === 'Boutique' ? 'boutique' : link === 'À propos' ? 'a-propos' : 'contact')}
                                            className="text-gray-600 hover:text-gold transition-colors text-sm"
                                        >
                                            {link}
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </div>

                        <div>
                            <h4 className="text-lg elegant-text font-semibold mb-4">Contact</h4>
                            <ul className="space-y-3 text-sm text-gray-600">
                                <li className="flex items-start gap-2">
                                    <MapPin className="w-5 h-5 text-gold flex-shrink-0 mt-0.5" />
                                    <span>123 Avenue des Champs-Élysées<br />75008 Paris, France</span>
                                </li>
                                <li className="flex items-center gap-2">
                                    <Phone className="w-5 h-5 text-gold flex-shrink-0" />
                                    <span>+33 1 23 45 67 89</span>
                                </li>
                                <li className="flex items-center gap-2">
                                    <Mail className="w-5 h-5 text-gold flex-shrink-0" />
                                    <span>contact@nexora.fr</span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div className="pt-8 border-t border-gray-100 flex flex-col md:flex-row justify-between items-center gap-4">
                        <p className="text-sm text-gray-500">
                            © 2024 NEXORA. Tous droits réservés.
                        </p>
                        <div className="flex gap-6 text-sm text-gray-500">
                            <a href="#" className="hover:text-gold transition-colors">Mentions légales</a>
                            <a href="#" className="hover:text-gold transition-colors">Politique de confidentialité</a>
                            <a href="#" className="hover:text-gold transition-colors">CGV</a>
                        </div>
                    </div>
                </div>
            </footer>

            {/* Cart Modal */}
            <CartModal 
                isOpen={isCartOpen}
                onClose={() => setIsCartOpen(false)}
                cartItems={cartItems}
                onRemoveFromCart={removeFromCart}
                onUpdateQuantity={updateQuantity}
            />

            {/* Toast Notification */}
            {toast && (
                <Toast 
                    message={toast.message} 
                    type={toast.type} 
                    onClose={() => setToast(null)} 
                />
            )}
        </div>
    );
};

// Rendu de l'application
const root = createRoot(document.getElementById('root'));
root.render(<NexoraElegant />);
</script>
</body>
</html>
